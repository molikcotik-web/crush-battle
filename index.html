<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D;function sz(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',sz);sz();
const K={},M={x:W/2,y:H/2,down:false},world={w:3200,h:2100};const walls=[{x:180,y:180,w:900,h:60},{x:2120,y:180,w:900,h:60},{x:180,y:1860,w:900,h:60},{x:2120,y:1860,w:900,h:60},{x:430,y:430,w:80,h:550},{x:2690,y:430,w:80,h:550},{x:780,y:470,w:300,h:70},{x:2120,y:470,w:300,h:70},{x:780,y:1560,w:300,h:70},{x:2120,y:1560,w:300,h:70},{x:1280,y:700,w:640,h:70},{x:1280,y:1330,w:640,h:70}];
const guns={'AK-47':[35,.11,30,90,.035,2700],'M4A1-S':[29,.085,30,90,.022,2900],'Deagle':[65,.34,7,35,.045,700],'AWP':[115,1.05,5,25,.007,4750],'Knife':[70,.45,1,0,0,0]};const P={x:1600,y:1050,r:18,hp:100,ar:100,gun:'AK-47',ammo:30,res:90,cool:0,reload:0,kills:0,money:800,ang:0};let bots=[],bul=[],parts=[],round=1,ct=0,tt=0,time=90,state='play';
function wall(a,b,r=0){return walls.some(q=>a+r>q.x&&a-r<q.x+q.w&&b+r>q.y&&b-r<q.y+q.h)}function mv(o,dx,dy){let a=o.x+dx,b=o.y;if(!wall(a,b,o.r)&&a>o.r&&a<world.w-o.r)o.x=a;b=o.y+dy;if(!wall(o.x,b,o.r)&&b>o.r&&b<world.h-o.r)o.y=b}function setgun(n){P.gun=n;P.ammo=guns[n][2];P.res=guns[n][3];P.cool=0;P.reload=0}function spawn(){let b;do b={x:Math.random()*2700+250,y:Math.random()*1600+250,r:17,hp:100,cd:Math.random()*1.4,s:Math.random()*7};while(Math.hypot(b.x-P.x,b.y-P.y)<650||wall(b.x,b.y,b.r));bots.push(b)}function start(){P.x=1600;P.y=1050;P.hp=100;P.ar=100;setgun('AK-47');bots=[];bul=[];parts=[];for(let i=0;i<8;i++)spawn();time=90;state='play';document.getElementById('panel').style.display='none'}function feed(s){let d=document.createElement('div');d.className='f';d.textContent=s;document.getElementById('feed').prepend(d);setTimeout(()=>d.remove(),1800)}function buy(n){if(n==='Armor'){if(P.money>=650){P.money-=650;P.ar=100;feed('🛡️ ARMOR PURCHASED')}}else if(P.money>=guns[n][5]){P.money-=guns[n][5];setgun(n);feed('🔫 '+n+' PURCHASED')}}function reload(){if(P.reload<=0&&P.ammo<guns[P.gun][2]&&P.res)P.reload=1.1}function hit(d){let a=Math.min(P.ar,d*.55);P.ar-=a;P.hp-=d-a;if(P.hp<=0){P.hp=0;tt++;end(false)}}function kill(b){let i=bots.indexOf(b);if(i>=0)bots.splice(i,1);P.kills++;P.money+=300;feed('☠️ YOU ➜ BOT +$300');if(!bots.length)end(true)}function end(win){state=win?'win':'lose';if(win){ct++;P.money+=325}else tt++;document.getElementById('card').innerHTML='<h1>'+(win?'🏆 ROUND WON':'💀 ROUND LOST')+'</h1><p>CT '+ct+' : '+tt+' T</p><p>☠️ Kills '+P.kills+' • 💰 $'+P.money+'</p><button onclick="round++;start()">NEXT ROUND</button>';document.getElementById('panel').style.display='flex'}
function fire(){if(state!='play'||P.reload||P.cool>0)return;let g=guns[P.gun];if(P.ammo<=0){reload();return}P.ammo--;P.cool=g[1];let a=P.ang+(Math.random()-.5)*g[4];if(P.gun==='Knife'){let b=bots.find(b=>Math.hypot(b.x-P.x,b.y-P.y)<70);if(b){b.hp-=g[0];if(b.hp<=0)kill(b)}return}bul.push({x:P.x+Math.cos(a)*30,y:P.y+Math.sin(a)*30,vx:Math.cos(a)*1250,vy:Math.sin(a)*1250,l:1.1,me:1,d:g[0]})}
function upd(dt){if(state!='play')return;time-=dt;if(time<=0){end(false);return}P.cool=Math.max(0,P.cool-dt);if(P.reload>0){P.reload-=dt;if(P.reload<=0){let n=Math.min(guns[P.gun][2]-P.ammo,P.res);P.ammo+=n;P.res-=n}}let dx=(K.d?1:0)-(K.a?1:0),dy=(K.s?1:0)-(K.w?1:0),l=Math.hypot(dx,dy)||1;mv(P,dx/l*285*dt,dy/l*285*dt);let cx=Math.max(0,Math.min(world.w-W,P.x-W/2)),cy=Math.max(0,Math.min(world.h-H,P.y-H/2));M.wx=M.x+cx;M.wy=M.y+cy;P.ang=Math.atan2(M.wy-P.y,M.wx-P.x);for(let b of bots){let dx=P.x-b.x,dy=P.y-b.y,d=Math.hypot(dx,dy);b.cd-=dt;b.s+=dt;if(d>290){let a=Math.atan2(dy,dx);mv(b,Math.cos(a)*90*dt,Math.sin(a)*90*dt)}else mv(b,Math.cos(b.s)*65*dt,Math.sin(b.s)*65*dt);if(d<760&&b.cd<=0){let a=Math.atan2(dy,dx)+(Math.random()-.5)*.12;bul.push({x:b.x,y:b.y,vx:Math.cos(a)*570,vy:Math.sin(a)*570,l:2,me:0,d:10});b.cd=.8+Math.random()*1.3}}for(let i=bul.length-1;i>=0;i--){let q=bul[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l<=0||wall(q.x,q.y,2)){bul.splice(i,1);continue}if(q.me){for(let j=bots.length-1;j>=0;j--){let b=bots[j];if(Math.hypot(q.x-b.x,q.y-b.y)<b.r){b.hp-=q.d*(q.y<b.y-6?2:1);bul.splice(i,1);if(b.hp<=0)kill(b);break}}}else if(Math.hypot(q.x-P.x,q.y-P.y)<P.r){bul.splice(i,1);hit(q.d)}}}
function draw(){x.clearRect(0,0,W,H);let cx=Math.max(0,Math.min(world.w-W,P.x-W/2)),cy=Math.max(0,Math.min(world.h-H,P.y-H/2));x.save();x.translate(-cx,-cy);x.fillStyle='#70716b';x.fillRect(0,0,world.w,world.h);for(let a=0;a<world.w;a+=70)for(let b=0;b<world.h;b+=70){x.fillStyle=((a/70+b/70)%2?'#696a64':'#74756f');x.fillRect(a,b,68,68)}x.fillStyle='#a77b4c';x.fillRect(2240,520,360,300);x.fillRect(600,520,360,300);x.fillStyle='#29221b';x.font='bold 92px Arial';x.fillText('A',2380,710);x.fillText('B',740,710);for(let q of walls){x.fillStyle='#3a3c39';x.fillRect(q.x,q.y,q.w,q.h);x.strokeStyle='#9a9c94';x.strokeRect(q.x,q.y,q.w,q.h)}for(let i=0;i<25;i++){let a=250+(i*367)%2700,b=300+(i*191)%1500;if(wall(a,b,20))continue;x.fillStyle='#745033';x.fillRect(a,b,55,55);x.strokeStyle='#a67b4c';x.strokeRect(a,b,55,55)}for(let q of bul){x.fillStyle=q.me?'#ffd45b':'#ff4d45';x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill()}for(let b of bots){x.fillStyle='#b52d26';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.fillStyle='#111';x.fillRect(b.x-18,b.y-29,36,5);x.fillStyle='#4bd45a';x.fillRect(b.x-18,b.y-29,36*Math.max(0,b.hp)/100,5);x.fillStyle='#ffe05b';x.font='bold 12px Arial';x.fillText('BOT',b.x-12,b.y-35)}x.save();x.translate(P.x,P.y);x.rotate(P.ang);x.fillStyle='#2d5276';x.beginPath();x.arc(0,0,P.r,0,7);x.fill();x.fillStyle='#151515';x.fillRect(5,-4,40,8);x.restore();x.restore();document.getElementById('hp').textContent=Math.ceil(P.hp);document.getElementById('ar').textContent=Math.ceil(P.ar);document.getElementById('kills').textContent=P.kills;document.getElementById('money').textContent='$'+P.money;document.getElementById('ct').textContent=ct;document.getElementById('tt').textContent=tt;document.getElementById('rd').textContent=round;document.getElementById('alive').textContent=bots.length+1;document.getElementById('tm').textContent=Math.max(0,Math.ceil(time))}
function loop(t){let dt=Math.min(.035,(t-(loop.t||t))/1000);loop.t=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='r')reload();if(e.key==='1')setgun('AK-47');if(e.key==='2')setgun('M4A1-S');if(e.key==='3')setgun('Deagle');if(e.key==='4')setgun('AWP');if(e.key==='5')setgun('Knife')});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);c.onmousemove=e=>{M.x=e.clientX;M.y=e.clientY};c.onmousedown=()=>{M.down=1;fire()};addEventListener('mouseup',()=>M.down=0);setInterval(()=>{if(M.down)fire()},60);document.querySelectorAll('[data-k]').forEach(b=>{b.ontouchstart=e=>{e.preventDefault();K[b.dataset.k]=1};b.ontouchend=e=>{e.preventDefault();K[b.dataset.k]=0}});fire.ontouchstart=e=>{e.preventDefault();M.down=1;fire()};fire.ontouchend=()=>M.down=0;start();
