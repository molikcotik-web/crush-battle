<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STRIKE ARENA</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial}canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud,#round,#hint{position:fixed;z-index:5;background:#101318dd;border:1px solid #555;border-radius:8px;padding:9px 12px;font-weight:800}#hud{left:12px;top:12px;line-height:1.5}#round{top:12px;left:50%;transform:translateX(-50%)}#hint{right:12px;bottom:12px;font-size:12px}
#feed{position:fixed;right:12px;top:60px;z-index:5;text-align:right}.f{background:#101318dd;border:1px solid #444;padding:5px 8px;margin:4px;border-radius:5px}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:24px;height:24px;pointer-events:none}.cross1{position:absolute;width:24px;height:2px;top:11px;background:#fff}.cross2{position:absolute;width:2px;height:24px;left:11px;background:#fff}
#center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none}#panel{display:none;pointer-events:auto;background:#0d1014f2;border:1px solid #666;border-radius:12px;padding:28px;text-align:center;min-width:280px}#panel h1{margin:0 0 10px}button{border:0;border-radius:7px;padding:12px 20px;font-weight:900;background:#d99a2b;color:#111}
#mobile{display:none;position:fixed;bottom:12px;left:12px;right:12px;z-index:6;justify-content:space-between;pointer-events:none}.pad{display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px;gap:4px;pointer-events:auto}.pad button,.fire{background:#15191dcc;color:#fff;border:1px solid #777}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.fire{width:95px;height:95px;border-radius:50%}
@media(max-width:700px){#mobile{display:flex}#hint{display:none}}
</style></head><body>
<canvas id="c"></canvas><div id="hud">❤️ HP <span id="hp">100</span> 🛡️ <span id="ar">100</span><br>🔫 <span id="gun">AK-47</span> <span id="ammo">30/90</span><br>☠️ <span id="kills">0</span> 💰 $<span id="money">800</span></div>
<div id="round">ROUND <span id="r">1</span> | CT <span id="ct">0</span> : <span id="tt">0</span> T</div><div id="feed"></div><div id="cross"><i class="cross1"></i><i class="cross2"></i></div><div id="hint">WASD • миша • ЛКМ • R • 1/2/3</div>
<div id="center"><div id="panel"></div></div><div id="mobile"><div class="pad"><button class="up" data-k="w">▲</button><button class="left" data-k="a">◀</button><button class="down" data-k="s">▼</button><button class="right" data-k="d">▶</button></div><button class="fire" id="fire">FIRE</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function size(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();
const K={},M={x:W/2,y:H/2,wx:0,wy:0,down:false},world={w:2800,h:1800},walls=[{x:180,y:150,w:800,h:55},{x:1820,y:150,w:800,h:55},{x:180,y:1595,w:800,h:55},{x:1820,y:1595,w:800,h:55},{x:480,y:400,w:70,h:450},{x:2250,y:400,w:70,h:450},{x:850,y:500,w:250,h:60},{x:1700,y:500,w:250,h:60},{x:850,y:1240,w:250,h:60},{x:1700,y:1240,w:250,h:60},{x:1200,y:680,w:400,h:60},{x:1200,y:1060,w:400,h:60}];
const guns={'AK-47':[34,.11,30,90,.035],'M4A1':[29,.085,30,90,.025],'Deagle':[65,.38,7,35,.055],'AWP':[115,1.15,5,25,.008]};
const p={x:1400,y:900,r:18,hp:100,ar:100,gun:'AK-47',ammo:30,res:90,cool:0,reload:0,kills:0,money:800,ang:0};let bots=[],bs=[],parts=[],round=1,ct=0,tt=0,state='play';
function wall(X,Y,r=0){return walls.some(q=>X+r>q.x&&X-r<q.x+q.w&&Y+r>q.y&&Y-r<q.y+q.h)}function move(o,dx,dy){let X=o.x+dx,Y=o.y;if(!wall(X,Y,o.r)&&X>o.r&&X<world.w-o.r)o.x=X;Y=o.y+dy;if(!wall(o.x,Y,o.r)&&Y>o.r&&Y<world.h-o.r)o.y=Y}
function gun(){let g=guns[p.gun];p.ammo=g[2];p.res=g[3];p.cool=0}function spawn(){let b;do{b={x:Math.random()*2400+200,y:Math.random()*1400+200,r:17,hp:100,cd:Math.random()};}while(Math.hypot(b.x-p.x,b.y-p.y)<600||wall(b.x,b.y,b.r));bots.push(b)}
function start(){p.x=1400;p.y=900;p.hp=100;p.ar=100;p.gun='AK-47';gun();bots=[];bs=[];parts=[];for(let i=0;i<8;i++)spawn();state='play';document.getElementById('panel').style.display='none'}
function feed(s){let d=document.createElement('div');d.className='f';d.textContent=s;document.getElementById('feed').prepend(d);setTimeout(()=>d.remove(),1800)}
function reload(){if(!p.reload&&p.ammo<guns[p.gun][2]&&p.res)p.reload=1.1}
function fire(){if(state!='play'||p.reload||p.cool>0)return;let g=guns[p.gun];if(!p.ammo){reload();return}p.ammo--;p.cool=g[1];let a=p.ang+(Math.random()-.5)*g[4];bs.push({x:p.x,y:p.y,vx:Math.cos(a)*1200,vy:Math.sin(a)*1200,life:1.1,from:1,d:g[0]})}
function hurt(d){let b=Math.min(p.ar,d*.55);p.ar-=b;p.hp-=d-b;if(p.hp<=0){p.hp=0;tt++;end(false)}}
function end(win){state=win?'win':'lose';if(win){ct++;p.money+=325}let q=document.getElementById('panel');q.innerHTML='<h1>'+(win?'🏆 ROUND WON':'💀 ROUND LOST')+'</h1><p>CT '+ct+' : '+tt+' T</p><p>☠️ Kills '+p.kills+' • 💰 $'+p.money+'</p><button onclick="round++;start()">NEXT ROUND</button>';q.style.display='block'}
function update(dt){if(state!='play')return;p.cool=Math.max(0,p.cool-dt);if(p.reload>0){p.reload-=dt;if(p.reload<=0){let need=guns[p.gun][2]-p.ammo,take=Math.min(need,p.res);p.ammo+=take;p.res-=take}}let dx=(K.d?1:0)-(K.a?1:0),dy=(K.s?1:0)-(K.w?1:0),l=Math.hypot(dx,dy)||1;move(p,dx/l*280*dt,dy/l*280*dt);
let cx=Math.max(0,Math.min(world.w-W,p.x-W/2)),cy=Math.max(0,Math.min(world.h-H,p.y-H/2));M.wx=M.x+cx;M.wy=M.y+cy;p.ang=Math.atan2(M.wy-p.y,M.wx-p.x);
for(let b of bots){let dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy);if(d>260)move(b,dx/d*85*dt,dy/d*85*dt);b.cd-=dt;if(d<700&&b.cd<=0){let a=Math.atan2(dy,dx)+(Math.random()-.5)*.13;bs.push({x:b.x,y:b.y,vx:Math.cos(a)*550,vy:Math.sin(a)*550,life:2,from:0,d:10});b.cd=.8+Math.random()*1.3}}
for(let i=bs.length-1;i>=0;i--){let q=bs[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0||wall(q.x,q.y,2)){bs.splice(i,1);continue}if(q.from){for(let j=bots.length-1;j>=0;j--){let b=bots[j];if(Math.hypot(q.x-b.x,q.y-b.y)<b.r){let dmg=q.d*(q.y<b.y-6?2:1);b.hp-=dmg;bs.splice(i,1);if(b.hp<=0){bots.splice(j,1);p.kills++;p.money+=300;feed('☠️ BOT ELIMINATED +$300');if(!bots.length)end(true)}break}}}else if(Math.hypot(q.x-p.x,q.y-p.y)<p.r){bs.splice(i,1);hurt(q.d)}}
}
function draw(){x.clearRect(0,0,W,H);let cx=Math.max(0,Math.min(world.w-W,p.x-W/2)),cy=Math.max(0,Math.min(world.h-H,p.y-H/2));x.save();x.translate(-cx,-cy);x.fillStyle='#70716b';x.fillRect(0,0,world.w,world.h);for(let X=0;X<world.w;X+=70)for(let Y=0;Y<world.h;Y+=70){x.fillStyle=((X/70+Y/70)%2?'#6b6c66':'#73746e');x.fillRect(X,Y,68,68)}x.fillStyle='#b88a50';x.fillRect(2050,470,330,300);x.fillRect(420,470,330,300);x.fillStyle='#222';x.font='bold 80px Arial';x.fillText('A',2180,650);x.fillText('B',550,650);for(let q of walls){x.fillStyle='#3c3e3b';x.fillRect(q.x,q.y,q.w,q.h);x.strokeStyle='#999';x.strokeRect(q.x,q.y,q.w,q.h)}for(let q of bs){x.fillStyle=q.from?'#ffd34d':'#ff4e4e';x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill()}for(let b of bots){x.fillStyle='#b52d25';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.fillStyle='#222';x.fillRect(b.x-18,b.y-29,36,5);x.fillStyle='#4bd15a';x.fillRect(b.x-18,b.y-29,36*Math.max(0,b.hp)/100,5)}x.save();x.translate(p.x,p.y);x.rotate(p.ang);x.fillStyle='#315579';x.beginPath();x.arc(0,0,p.r,0,7);x.fill();x.fillStyle='#181818';x.fillRect(5,-4,38,8);x.restore();x.restore();
document.getElementById('hp').textContent=Math.ceil(p.hp);document.getElementById('ar').textContent=Math.ceil(p.ar);document.getElementById('gun').textContent=p.gun;document.getElementById('ammo').textContent=p.reload?'RELOAD':p.ammo+'/'+p.res;document.getElementById('kills').textContent=p.kills;document.getElementById('money').textContent=p.money;document.getElementById('r').textContent=round;document.getElementById('ct').textContent=ct;document.getElementById('tt').textContent=tt}
function loop(t){let dt=Math.min(.035,(t-(loop.t||t))/1000);loop.t=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key.toLowerCase()=='r')reload();if(e.key=='1'){p.gun='AK-47';gun()}if(e.key=='2'){p.gun='M4A1';gun()}if(e.key=='3'){p.gun='AWP';gun()}});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);c.onmousemove=e=>{M.x=e.clientX;M.y=e.clientY};c.onmousedown=()=>{M.down=1;fire()};addEventListener('mouseup',()=>M.down=0);setInterval(()=>{if(M.down)fire()},60);document.querySelectorAll('[data-k]').forEach(b=>{b.ontouchstart=e=>{e.preventDefault();K[b.dataset.k]=1};b.ontouchend=e=>{e.preventDefault();K[b.dataset.k]=0}});fireBtn.ontouchstart=e=>{e.preventDefault();M.down=1;fire()};fireBtn.ontouchend=()=>M.down=0;start();
</script></body></html>
